name: Build and Release Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring permanent debug.keystore from repository..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ -f debug.keystore ] && keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "Permanent debug.keystore verified successfully."
          else
            echo "Keystore missing or invalid, generating consistent fallback..."
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          CI: "true"
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovelAI-TTS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionName[ =]+"(.*)".*/\1/')
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | head -n 1 | sed -E 's/.*versionCode[ =]+([0-9]+).*/\1/')
          [ -z "$VERSION_NAME" ] && VERSION_NAME="2.4"
          [ -z "$VERSION_CODE" ] && VERSION_CODE="15"
          
          # Unique tag per version and build code so older releases are ALWAYS PRESERVED
          RELEASE_TAG="v${VERSION_NAME}-b${VERSION_CODE}"
          RELEASE_TITLE="NovelAI TTS v${VERSION_NAME} (Build ${VERSION_CODE})"
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M UTC')
          
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Publishing new release $RELEASE_TITLE with tag $RELEASE_TAG..."
            
            # Create a brand new release for this version (keeps all past releases intact)
            gh release create "$RELEASE_TAG" "$APK_FILE" \
              --title "$RELEASE_TITLE" \
              --notes "ดาวน์โหลดไฟล์ APK เวอร์ชัน ${VERSION_NAME} (Build ${VERSION_CODE}) คอมไพล์สำเร็จจาก Commit: ${{ github.sha }} เมื่อ ${BUILD_TIME}" \
              --latest || \
            gh release upload "$RELEASE_TAG" "$APK_FILE" --clobber
              
            echo "Successfully created and published new release: $RELEASE_TITLE"
          else
            echo "No APK file found to release."
          fi
