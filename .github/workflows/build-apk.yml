name: Build and Release Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Restoring permanent debug.keystore from repository..."
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ -f debug.keystore ] && keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "Permanent debug.keystore verified successfully."
          else
            echo "Keystore missing or invalid, generating consistent fallback..."
            rm -f debug.keystore
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK with Gradle
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          CI: "true"
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovelAI-TTS-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish APK to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          fi

          echo "Target Release Tag: $TAG_NAME"
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Publishing $APK_FILE to release $TAG_NAME..."
            # Try to upload to existing release first, if not found, create new release
            gh release upload "$TAG_NAME" "$APK_FILE" --clobber || \
            gh release create "$TAG_NAME" "$APK_FILE" \
              --title "NovelAI TTS (Latest APK)" \
              --notes "ดาวน์โหลดไฟล์ APK เวอร์ชันล่าสุดที่คอมไพล์สำเร็จ (อัปเดตอัตโนมัติจาก Commit: ${{ github.sha }})" \
              --latest
          else
            echo "No APK file found to release."
          fi
